[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-img"
version = "0.1.0"
description = "Extract plain text from images with Tesseract, from the CLI or a Gradio web UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pillow>=10.0",
]

[project.optional-dependencies]
web = ["gradio>=4.0"]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
ocr-img = "ocr_img.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_img"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "e2e: end-to-end tests that need a real tesseract binary (and gradio for the web cases)",
]
